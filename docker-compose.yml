version: '2'

services:
    traefik:
        image: traefik:v3.6
        command:
            - "--api.insecure=true"
            - "--providers.docker=true"
            - "--entrypoints.web.address=:80"
        ports:
            - "80:80"
            - "8080:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        networks:
            - code-network
    web:
        image: nginx
        ports:
            - "1001:80"
        volumes:
            - ./src:/src
            - ./site.conf:/etc/nginx/conf.d/default.conf
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.trolley.rule=Host(`trolley.localhost`)"
            - "traefik.http.services.trolley.loadbalancer.server.port=80"
        networks:
            - code-network
    php:
        #image: php:fpm
        build:
            context: ./dockerfiles/
            dockerfile: ./Dockerfile
        volumes:
            - ./src:/src
        labels:
            - "traefik.enable=false"
        networks:
            - code-network
    db:
        image: postgres
        ports: 
            - "5432:5432"
        restart: always
        environment:
            #server: db
            #username: postgres
            POSTGRES_PASSWORD: example
            #database: postgres
        volumes:
            - ./src:/src
            #- ./postgres-data:/var/lib/postgresql/data
        networks:
            - code-network
    adminer:
        image: adminer
        restart: always
        ports:
            - 5678:8080
        networks:
            - code-network

networks:
    code-network:
        driver: bridge